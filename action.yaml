name: 'IssueOps Command Action'
description: 'IssueOps commands in GitHub Actions.'
author: 'knowledge-work'
branding:
  color: white
  icon: message-square

inputs:
  command:
    description: 'The name of the command to be used in IssueOps, which can be specified as a comma-separated list.'
    required: true
  allowed_contexts:
    description: 'The comment contexts that trigger the IssueOps command, specified as a comma-separated list. Allowed values: `"issue"`, `"pull_request"`, `"discussion"`.'
    default: 'issue,pull_request,discussion'
  allowed_permissions:
    description: 'Restricts the command to event senders whose repository role is in this comma-separated list, looked up with `github_token`. Allowed values: `"admin"`, `"maintain"`, `"write"`, `"triage"`, `"read"`. When unset, no permission check is performed. On a public repository, `"read"` lets any GitHub user through.'
  github_token:
    description: 'The token used to look up the repository role of the event sender when `allowed_permissions` is set.'
    default: '${{ github.token }}'

outputs:
  continue:
    description: 'The string `"true"` when the comment contains an allowed IssueOps command (and, if `allowed_permissions` is set, the actor holds one of those permissions); otherwise `"false"`. Without `allowed_permissions` this is a syntax check only and does not authorize the commenter.'
  params:
    description: 'The parameters of the triggered IssueOps command, provided as a JSON string.'
  comment_id:
    description: 'The ID of the comment that triggered this action.'
  actor:
    description: 'The GitHub handle of the user who triggered the event (the event sender). On an edited comment this is the editor, not the original author.'
  issue_number:
    description: '[Deprecated] The issue number of the comment that triggered this action. Use `number` instead. This output will be removed in the next major release.'
  number:
    description: 'The number of the issue, pull request, or discussion that triggered this action.'
  context:
    description: 'The context that triggered this action. One of `"issue"`, `"pull_request"`, or `"discussion"`.'
  command:
    description: 'The command of the triggered IssueOps command.'

runs:
  using: 'node24'
  main: 'dist/index.js'
