name: automerge-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-passed:
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: pkgdeps/automerge-gate@fe5d7cd2fc17778dc42f6916f9d9990cb259ad01 # v5.0.0
        with:
          gate-mode: 'public'
          ignore-checks: |
            [
              { "name": "dogfood" },
              { "name": "publish" }
            ]
